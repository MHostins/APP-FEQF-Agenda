name: Monitor Notion -> WhatsApp (FEQF)

on:
  schedule:
    # Roda automaticamente a cada 10 minutos na nuvem do GitHub
    - cron: "*/10 * * * *"
  workflow_dispatch:
    # Permite rodar manualmente com 1 clique na aba Actions do GitHub

permissions:
  contents: write

jobs:
  verificar-novos-eventos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests python-dotenv tzdata

      - name: Verificar novos eventos no Notion e enviar WhatsApp
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_CHAT_IDS: ${{ secrets.GREENAPI_CHAT_IDS }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python notificador_whatsapp.py --min-age-minutes 2

      - name: Salvar IDs dos eventos já notificados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notified_events.json
          if ! git diff --staged --quiet; then
            git commit -m "Registra novos eventos notificados via WhatsApp [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
